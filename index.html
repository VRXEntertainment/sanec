<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dark Website</title>

    <!-- Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0A0A0A;
            color: #FFFFFF;
            font-family: "Montserrat", sans-serif;
        }

        /* =========================
           ВЕРХНЯЯ ПАНЕЛЬ
        ========================= */

        header {
            position: relative;

            height: 70px;

            background: #0A0A0A;

            border-bottom: 1px solid #242424;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 25px;
        }

        /* Логотип слева */
        .logo {
            position: absolute;
            left: 25px;

            font-size: 21px;
            font-weight: 700;

            color: #FFFFFF;
        }

        /* =========================
           ЦЕНТРАЛЬНАЯ НАВИГАЦИЯ
        ========================= */

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            padding: 10px 16px;

            color: #FFFFFF;
            text-decoration: none;

            border-radius: 8px;

            font-size: 14px;

            /* SEMIBOLD */
            font-weight: 600;

            transition: 0.2s;
        }

        nav a:hover {
            background: #1A1A1A;
        }

        /* Активная кнопка */
        nav a.active {
            background: #181818;
        }

        /* =========================
           ПРОФИЛЬ СПРАВА
        ========================= */

        .profile {
            position: absolute;
            right: 25px;

            display: flex;
            align-items: center;
        }

        /* Кнопка "Войти" */
        .login-button {
            padding: 10px 18px;

            background: #2563EB;
            color: #FFFFFF;

            border: none;
            border-radius: 8px;

            font-family: "Montserrat", sans-serif;
            font-size: 14px;

            /* SEMIBOLD */
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #1D4ED8;
        }

        /* Аватар авторизованного пользователя */
        .avatar {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #303030;

            cursor: pointer;

            transition: 0.2s;
        }

        .avatar:hover {
            border-color: #2563EB;
        }

        /* =========================
           ГЛАВНЫЙ ЭКРАН
        ========================= */

        .hero {
            min-height: calc(100vh - 70px);

            background: #0A0A0A;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px 20px;
        }

        .hero-content {
            max-width: 700px;
        }

        /* Заголовок — BOLD */
        h1 {
            margin: 0 0 18px;

            font-size: 52px;
            line-height: 1.1;

            font-weight: 700;
        }

        /* Текст — REGULAR */
        .description {
            margin: 0 auto 30px;

            max-width: 600px;

            color: #AFAFAF;

            font-size: 16px;
            line-height: 1.7;

            font-weight: 400;
        }

        /* Жирный текст — BOLD */
        strong {
            color: #FFFFFF;
            font-weight: 700;
        }

        /* Главная кнопка — SEMIBOLD */
        .button {
            display: inline-block;

            padding: 14px 26px;

            background: #2563EB;
            color: #FFFFFF;

            border-radius: 9px;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition: 0.2s;
        }

        .button:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
        }

        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
        ========================= */

        @media (max-width: 700px) {

            .logo {
                display: none;
            }

            header {
                justify-content: flex-start;
                padding-left: 15px;
            }

            nav {
                gap: 2px;
            }

            nav a {
                padding: 9px 10px;
                font-size: 12px;
            }

            .profile {
                right: 15px;
            }

            .login-button {
                padding: 9px 12px;
                font-size: 12px;
            }

            h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ВЕРХНЯЯ ПАНЕЛЬ
    ========================= -->

    <header>

        <!-- Логотип -->
        <div class="logo">
            MY SITE
        </div>

        <!-- Кнопки по центру -->
        <nav>
            <a href="#" class="active">Главная</a>
            <a href="#">Проекты</a>
            <a href="#">Новости</a>
            <a href="#">О нас</a>
        </nav>

        <!-- OAuth 2.0 профиль -->
        <div class="profile">

            <!-- Если пользователь НЕ вошёл -->
            <button class="login-button">
                Войти
            </button>

            <!--
            Если пользователь вошёл,
            вместо кнопки выше можно показать:

            <img
                class="avatar"
                src="avatar.jpg"
                alt="Аватар"
            >
            -->

        </div>

    </header>

    <!-- =========================
         ГЛАВНЫЙ ЭКРАН
    ========================= -->

    <main class="hero">

        <div class="hero-content">

            <h1>Добро пожаловать!</h1>

            <p class="description">
                Современный сайт с
                <strong>тёмным интерфейсом</strong>
                и минималистичным дизайном.
            </p>

            <a href="#" class="button">
                Начать
            </a>

        </div>

    </main>

</body>
</html>
